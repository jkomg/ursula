<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ursula</title>
<style>
  :root{
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
    --bg:#f6f4ef; --panel:#fffdf9; --ink:#20211f; --dim:#6b6a63; --line:#ddd8cd;
    --accent:#a8521f; --accent-soft:#f0e3d6;
    --must:#b23c17; --should:#8a6d1f; --back:#6b6a63;
    --done:#3f6b52; --prog:#8a6d1f; --err:#b23c17; --free:#3f6b52;
  }
  :root:not([data-theme="light"]){
    @media (prefers-color-scheme: dark){
      --bg:#17181a; --panel:#1f2124; --ink:#ece9e3; --dim:#9b9992; --line:#33363a;
      --accent:#e0915c; --accent-soft:#33261d;
      --must:#e07a5a; --should:#d6b45c; --back:#9b9992;
      --done:#7fb597; --prog:#d6b45c; --err:#e07a5a; --free:#7fb597;
    }
  }
  :root[data-theme="dark"]{
    --bg:#17181a; --panel:#1f2124; --ink:#ece9e3; --dim:#9b9992; --line:#33363a;
    --accent:#e0915c; --accent-soft:#33261d;
    --must:#e07a5a; --should:#d6b45c; --back:#9b9992;
    --done:#7fb597; --prog:#d6b45c; --err:#e07a5a; --free:#7fb597;
  }
  *,*::before,*::after{box-sizing:inherit}
  html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100%;
    font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.5}
  .wrap{max-width:920px;margin:0 auto;padding:28px 18px 80px}
  header{border-bottom:2px solid var(--ink);padding-bottom:14px}
  .eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  h1{font-size:clamp(24px,5vw,34px);margin:6px 0 4px;letter-spacing:-.02em;line-height:1.1}
  .sub{color:var(--dim);font-size:13.5px;margin:0}
  .meter{display:flex;gap:8px;align-items:center;margin:16px 0 4px;flex-wrap:wrap}
  .bar{flex:1 1 180px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:140px}
  .bar i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
  .meter b{font-variant-numeric:tabular-nums;font-size:13px}
  .meter span{font-size:12.5px;color:var(--dim)}
  #status{font-size:12px;color:var(--dim);min-height:17px;margin-top:8px}
  #status.bad{color:var(--err)}
  .panel{margin:26px 0 0;border:1px solid var(--line);border-radius:8px;background:var(--panel);overflow:hidden}
  .panel h3{margin:0;padding:11px 14px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}
  .panel h3 b{font-weight:400;color:var(--dim);letter-spacing:.02em;text-transform:none;font-size:12px}
  .day{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:baseline}
  .day:last-child{border-bottom:0}
  .day.today{background:var(--accent-soft)}
  .day b{flex:0 0 74px;font-size:12.5px}
  .day .fx{flex:1;color:var(--dim);min-width:0}
  .day .op{flex:0 0 auto;font-size:12px;color:var(--free);font-weight:600;white-space:nowrap}
  .day .op.none{color:var(--must)}
  h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin:34px 0 4px;display:flex;align-items:baseline;gap:9px}
  h2 em{font-style:normal;font-size:11px;color:var(--dim);letter-spacing:.02em;text-transform:none;font-weight:400}
  .l-must h2{color:var(--must)} .l-should h2{color:var(--should)} .l-back h2{color:var(--back)}
  .l-done h2{color:var(--done);cursor:pointer;user-select:none}
  .l-done .card{border-left-color:var(--done)}
  .l-done h2 .chev{font-size:10px;transition:transform .15s;display:inline-block;margin-left:2px}
  .l-done.open h2 .chev{transform:rotate(90deg)}
  .l-done .body{display:none} .l-done.open .body{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--line);
    border-radius:8px;padding:12px 14px;margin-bottom:9px}
  .l-must .card{border-left-color:var(--must)} .l-should .card{border-left-color:var(--should)}
  .l-back .card{border-left-color:var(--back)}
  .card.is-done{opacity:.55} .card.is-done .title{text-decoration:line-through}
  .top{display:flex;gap:12px;align-items:flex-start}
  .title{font-weight:600;flex:1;min-width:0;font-size:15px}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .tag{font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line);
    color:var(--dim);white-space:nowrap;text-decoration:none}
  a.tag:hover{border-color:var(--accent);color:var(--accent)}
  .tag.key{font-weight:700;font-variant-numeric:tabular-nums}
  .tag.due{border-color:var(--accent);color:var(--accent);font-weight:600}
  .tag.od{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
  .st{border:1px solid var(--line);background:transparent;color:var(--dim);font:inherit;
    font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
    padding:4px 10px;border-radius:99px;cursor:pointer;white-space:nowrap;flex:none}
  .st:hover{border-color:var(--accent)}
  .st:disabled{opacity:.5;cursor:wait}
  .st.doing{color:var(--prog);border-color:var(--prog)}
  .st.done{color:var(--done);border-color:var(--done)}
  .st.blocked{color:var(--err);border-color:var(--err)}
  .picker{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px;
    padding-top:9px;border-top:1px dashed var(--line);font-size:12px;color:var(--dim)}
  .move{border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;
    font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;cursor:pointer}
  .move:hover{border-color:var(--accent);color:var(--accent)}
  .move:disabled{opacity:.5;cursor:wait}
  .note{width:100%;margin-top:9px;background:transparent;border:0;border-top:1px dashed var(--line);
    color:var(--ink);font:inherit;font-size:13.5px;padding:8px 0 0;resize:vertical;min-height:30px}
  .note::placeholder{color:var(--dim);opacity:.65}
  .note:focus{outline:none;border-top-color:var(--accent)}
  .row{display:flex;gap:10px;align-items:center;margin-top:7px;min-height:20px;flex-wrap:wrap}
  .push{border:1px solid var(--accent);background:transparent;color:var(--accent);font:inherit;
    font-size:11.5px;font-weight:600;padding:3px 10px;border-radius:99px;cursor:pointer}
  .push:disabled{opacity:.5;cursor:wait}
  .sync{font-size:11.5px;color:var(--dim)}
  .sync.ok{color:var(--done)} .sync.bad{color:var(--err)}
  .empty{border:1px dashed var(--line);border-radius:8px;padding:22px;color:var(--dim);
    font-size:14px;text-align:center;margin-top:20px}
  .empty code{background:var(--accent-soft);color:var(--accent);padding:1px 6px;border-radius:4px;font-size:13px}
  footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--dim);font-size:12.5px}
  @media(max-width:600px){ .top{flex-wrap:wrap} .st{order:3} .day{flex-wrap:wrap} .day b{flex-basis:100%} }
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="eyebrow">Ursula</div>
  <h1 id="hdr">This week</h1>
  <p class="sub">Your open work and your actual week, read live. Status changes write back; notes post as comments when you send them.</p>
</header>

<div class="meter">
  <b id="pct">—</b>
  <div class="bar"><i id="fill"></i></div>
  <span id="tally"></span>
</div>
<div id="status">Connecting…</div>

<div class="panel" id="calpanel" style="display:none">
  <h3>What the week can hold <b id="calnote"></b></h3>
  <div id="days"></div>
</div>

<div id="lanes"></div>

<footer id="foot">Jira is the record. This is the view.</footer>
</div>

<script>
/* ---------- CONFIG: the only part another person changes ---------- */
const CFG = {
  LABEL: "ursula",                       // Jira label marking work this board tracks
  JQL: 'assignee = currentUser() AND labels = "%LABEL%" ORDER BY duedate ASC, priority DESC',
  JIRA: "Atlassian",                     // connector display name
  GCAL: "Custom Google Drive",           // connector exposing google_calendar_events_list
  DAY_START: 9, DAY_END: 18,             // working window for gap detection
  MIN_GAP: 45                            // minutes; shorter gaps aren't real work time
};
/* Lanes derive from Jira priority — no hand-sorting, so it works for anyone. */
const LANES = [
  {k:"must",  n:"Must land",  e:"critical",     match:p => /^(critical|highest|blocker)$/i.test(p)},
  {k:"should",n:"Should land",e:"major",        match:p => /^(major|high|medium)$/i.test(p)},
  {k:"back",  n:"Background", e:"everything else", match:() => true}
];

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hhmm = d => pad(d.getHours())+":"+pad(d.getMinutes());
const DAYNAME = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let mcp = null, db = null, cloudId = null;
let issues = [], drafts = {}, syncState = {};
let doneOpen = false;
try{ doneOpen = localStorage.getItem("ursula.doneOpen") === "1"; }catch(e){}
function saveDoneOpen(){
  try{ localStorage.setItem("ursula.doneOpen", doneOpen ? "1" : "0"); }catch(e){}
}

function setStatus(m, bad){ const s = $("status"); s.textContent = m || ""; s.className = bad ? "bad" : ""; }
function errText(e){
  const m = {not_granted:"access not granted", server_not_connected:"connector not connected",
    not_in_manifest:"call outside approved scope", tool_error:"rejected by the service",
    rate_limited:"rate limited", cancelled:"cancelled",
    service_said:"Jira reported a problem",
    bad_shape:"response came back in a shape I couldn't read"};
  const base = (e && m[e.code]) || (e && e.code) || "unknown error";
  return e && e.detail ? base + " — " + e.detail : base;
}
const RAW = {};
async function call(server, tool, input){
  let r;
  try{
    r = await mcp.callTool(server, tool, input);
  }catch(e){
    RAW[tool] = {threw: String((e && e.code) || e)};
    throw e;
  }
  const payload = r && r.payload !== undefined ? r.payload : r;
  try{
    RAW[tool] = JSON.parse(JSON.stringify(payload));
  }catch(e){ RAW[tool] = String(payload); }
  return payload;
}
/* If the service reported its own problem, say that rather than "bad shape". */
function raiseIfServiceError(p){
  if(!p || typeof p !== "object") return;
  const msgs = []
    .concat(Array.isArray(p.errorMessages) ? p.errorMessages : [])
    .concat(p.errors && typeof p.errors === "object" ? Object.values(p.errors) : [])
    .concat(typeof p.message === "string" && !p.issues ? [p.message] : [])
    .concat(typeof p.error === "string" ? [p.error] : []);
  if(msgs.length) throw {code:"service_said", detail: msgs.join(" · ")};
}
/* Responses arrive in several shapes depending on the connector: a plain object,
   a JSON string, or MCP content blocks wrapping either. Dig until we hit data. */
function unwrap(p, depth){
  depth = depth || 0;
  if(p == null || depth > 6) return null;
  if(typeof p === "string"){
    const s = p.trim();
    if(!s || (s[0] !== "{" && s[0] !== "[")) return null;
    try{ return unwrap(JSON.parse(s), depth + 1); }catch(e){ return null; }
  }
  if(Array.isArray(p)){
    if(p.length && p[0] && typeof p[0] === "object" && typeof p[0].text === "string"){
      return unwrap(p[0].text, depth + 1);
    }
    return p;
  }
  if(typeof p === "object"){
    if(Array.isArray(p.content)) return unwrap(p.content, depth + 1);
    if(typeof p.text === "string") return unwrap(p.text, depth + 1);
    return p;
  }
  return null;
}

/* Collections arrive either as a bare array or wrapped: {nodes:[…]} / {values:[…]}.
   Returns the array, or null when there genuinely isn't one. */
function listOf(x){
  if(Array.isArray(x)) return x;
  if(x && typeof x === "object"){
    if(Array.isArray(x.nodes)) return x.nodes;
    if(Array.isArray(x.values)) return x.values;
    if(Array.isArray(x.results)) return x.results;
    if(Array.isArray(x.items)) return x.items;
  }
  return null;
}

/* ---------- Jira ---------- */
async function resolveCloudId(){
  const p = unwrap(await call(CFG.JIRA, "getAccessibleAtlassianResources", {}));
  const list = Array.isArray(p) ? p : (p && (p.values || p.resources)) || [];
  const hit = list.find(r => r && r.id);
  if(!hit) throw {code:"bad_shape"};
  return hit.id;
}
async function loadIssues(){
  const jql = CFG.JQL.replace("%LABEL%", CFG.LABEL);
  const p = unwrap(await call(CFG.JIRA, "searchJiraIssuesUsingJql", {
    cloudId, jql, maxResults: 100,
    fields: ["summary","status","priority","duedate","labels","project"]
  }));
  raiseIfServiceError(p);
  const rows = listOf(p && p.issues) || listOf(p);
  if(!rows) throw {code:"bad_shape"};
  return rows.filter(r => r && r.key && r.fields);
}
async function transitionsFor(key){
  const p = unwrap(await call(CFG.JIRA, "getTransitionsForJiraIssue", {cloudId, issueIdOrKey: key}));
  raiseIfServiceError(p);
  const ts = listOf(p && p.transitions) || listOf(p);
  if(!ts) throw {code:"bad_shape"};
  return ts
    .map(t => ({id: String(t.id), name: (t.to && t.to.name) || t.name || ""}))
    .filter(t => t.id && t.name);
}
async function applyTransition(key, id){
  const p = unwrap(await call(CFG.JIRA, "transitionJiraIssue",
    {cloudId, issueIdOrKey: key, transition: {id: String(id)}}));
  // Prefer the status Jira reports back over anything we assumed.
  const s = p && p.fields && p.fields.status;
  return s && s.name ? s : null;
}

/* ---------- Calendar ---------- */
function weekBounds(){
  const now = new Date();
  const dow = now.getDay();                 // 0 Sun
  const back = dow === 0 ? 6 : dow - 1;     // back to Monday
  const mon = new Date(now); mon.setDate(now.getDate() - back); mon.setHours(0,0,0,0);
  const sat = new Date(mon); sat.setDate(mon.getDate() + 5);
  return [mon, sat];
}
async function loadWeek(){
  const [a,b] = weekBounds();
  const p = unwrap(await call(CFG.GCAL, "google_calendar_events_list", {
    calendarId: "primary", singleEvents: true, maxResults: 250,
    timeMin: a.toISOString(), timeMax: b.toISOString()
  }));
  const items = listOf(p && p.items) || listOf(p) || [];
  return items.filter(e =>
    e.status !== "cancelled" &&
    e.eventType !== "workingLocation" &&
    e.eventType !== "outOfOffice" &&
    e.transparency !== "transparent" &&
    e.start && e.start.dateTime
  ).map(e => ({
    summary: e.summary || "(busy)",
    start: new Date(e.start.dateTime),
    end: new Date(e.end && e.end.dateTime ? e.end.dateTime : e.start.dateTime)
  })).sort((x,y) => x.start - y.start);
}
function gapsFor(evts, day){
  const open = new Date(day); open.setHours(CFG.DAY_START,0,0,0);
  const close = new Date(day); close.setHours(CFG.DAY_END,0,0,0);
  const busy = evts.filter(e => e.end > open && e.start < close)
                   .map(e => [new Date(Math.max(e.start,open)), new Date(Math.min(e.end,close))])
                   .sort((a,b) => a[0]-b[0]);
  const merged = [];
  for(const b of busy){
    const last = merged[merged.length-1];
    if(last && b[0] <= last[1]){ if(b[1] > last[1]) last[1] = b[1]; }
    else merged.push([new Date(b[0]), new Date(b[1])]);
  }
  const gaps = []; let cur = open;
  for(const [s,e] of merged){
    if(s - cur >= CFG.MIN_GAP*60000) gaps.push([new Date(cur), new Date(s)]);
    if(e > cur) cur = e;
  }
  if(close - cur >= CFG.MIN_GAP*60000) gaps.push([new Date(cur), new Date(close)]);
  return gaps;
}
function renderWeek(evts){
  const [mon] = weekBounds();
  const host = $("days"); host.innerHTML = "";
  const todayKey = ymd(new Date());
  let totalFree = 0;
  for(let i=0;i<5;i++){
    const day = new Date(mon); day.setDate(mon.getDate()+i);
    const dayEv = evts.filter(e => ymd(e.start) === ymd(day));
    const gaps = gapsFor(dayEv, day);
    const free = gaps.reduce((m,[s,e]) => m + (e-s)/60000, 0);
    totalFree += free;
    const row = document.createElement("div");
    row.className = "day" + (ymd(day) === todayKey ? " today" : "");
    const b = document.createElement("b"); b.textContent = DAYNAME[day.getDay()]+" "+day.getDate();
    const fx = document.createElement("span"); fx.className = "fx";
    fx.textContent = dayEv.length
      ? dayEv.map(e => hhmm(e.start)+" "+e.summary).join(" · ")
      : "Clear";
    const op = document.createElement("span");
    op.className = "op" + (free < CFG.MIN_GAP ? " none" : "");
    op.textContent = free < CFG.MIN_GAP ? "No open time"
      : gaps.map(([s,e]) => hhmm(s)+"–"+hhmm(e)).join(", ");
    row.appendChild(b); row.appendChild(fx); row.appendChild(op);
    host.appendChild(row);
  }
  $("calnote").textContent = Math.round(totalFree/60) + "h open across the week";
  $("calpanel").style.display = "";
}

/* ---------- Board ---------- */
function isDone(iss){
  const c = iss.fields.status && iss.fields.status.statusCategory;
  return c && c.key === "done";
}
function stClass(iss){
  const n = (iss.fields.status && iss.fields.status.name || "").toLowerCase();
  if(isDone(iss)) return "done";
  if(/block|imped|wait/.test(n)) return "blocked";
  if(/progress|doing|review/.test(n)) return "doing";
  return "";
}
function renderBoard(){
  const host = $("lanes"); host.innerHTML = "";
  if(!issues.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.innerHTML = 'Nothing carries the <code>' + CFG.LABEL + '</code> label yet. ' +
      'Label the issues you want tracked, then reload.';
    host.appendChild(e);
    return;
  }
  const open = issues.filter(i => !isDone(i));
  const finished = issues.filter(isDone);

  const used = new Set();
  for(const L of LANES){
    const rows = open.filter(i => {
      if(used.has(i.key)) return false;
      const p = (i.fields.priority && i.fields.priority.name) || "";
      if(!L.match(p)) return false;
      used.add(i.key); return true;
    });
    if(!rows.length) continue;
    const sec = document.createElement("section");
    sec.className = "l-" + L.k;
    const h = document.createElement("h2"); h.textContent = L.n;
    const em = document.createElement("em"); em.textContent = L.e + " · " + rows.length; h.appendChild(em);
    sec.appendChild(h);
    for(const iss of rows) sec.appendChild(card(iss));
    host.appendChild(sec);
  }

  if(!open.length && finished.length){
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "Nothing open. The whole tracked set is done.";
    host.appendChild(e);
  }

  if(finished.length){
    const sec = document.createElement("section");
    sec.className = "l-done" + (doneOpen ? " open" : "");
    const h = document.createElement("h2");
    const chev = document.createElement("span"); chev.className = "chev"; chev.textContent = "▶";
    h.appendChild(chev);
    h.appendChild(document.createTextNode(" Done"));
    const em = document.createElement("em");
    em.textContent = finished.length + (doneOpen ? " · click to hide" : " · click to show");
    h.appendChild(em);
    h.addEventListener("click", () => { doneOpen = !doneOpen; saveDoneOpen(); renderBoard(); });
    sec.appendChild(h);
    const body = document.createElement("div"); body.className = "body";
    for(const iss of finished) body.appendChild(card(iss));
    sec.appendChild(body);
    host.appendChild(sec);
  }
  tally();
}
function card(iss){
  const f = iss.fields;
  const c = document.createElement("article");
  c.className = "card" + (isDone(iss) ? " is-done" : "");

  const top = document.createElement("div"); top.className = "top";
  const t = document.createElement("div"); t.className = "title"; t.textContent = f.summary;
  const b = document.createElement("button");
  b.className = "st " + stClass(iss);
  b.textContent = (f.status && f.status.name) || "—";
  top.appendChild(t); top.appendChild(b); c.appendChild(top);

  const tg = document.createElement("div"); tg.className = "tags";
  const key = document.createElement("a"); key.className = "tag key"; key.textContent = iss.key;
  key.href = iss.webUrl || ((iss.self || "").split("/rest/")[0] + "/browse/" + iss.key);
  key.target = "_blank"; key.rel = "noopener";
  tg.appendChild(key);
  if(f.duedate){
    const d = document.createElement("span");
    const overdue = f.duedate < ymd(new Date()) && !isDone(iss);
    d.className = "tag " + (overdue ? "od" : "due");
    d.textContent = (overdue ? "Overdue " : "Due ") + f.duedate;
    tg.appendChild(d);
  }
  if(f.project){ const p = document.createElement("span"); p.className="tag"; p.textContent=f.project.key; tg.appendChild(p); }
  c.appendChild(tg);

  const picker = document.createElement("div");
  picker.className = "picker"; picker.style.display = "none"; picker.dataset.open = "0";
  c.appendChild(picker);

  const note = document.createElement("textarea");
  note.className = "note"; note.rows = 1;
  note.placeholder = "What actually happened…";
  note.value = drafts[iss.key] || "";
  c.appendChild(note);

  const row = document.createElement("div"); row.className = "row";
  const push = document.createElement("button"); push.className = "push"; push.textContent = "Send note to Jira";
  const sync = document.createElement("span"); sync.className = "sync";
  row.appendChild(push); row.appendChild(sync); c.appendChild(row);

  const refresh = () => {
    push.style.display = (note.value || "").trim() ? "" : "none";
    const s = syncState[iss.key];
    if(s && s.err){ sync.className = "sync bad"; sync.textContent = s.err; }
    else if(s && s.ok){ sync.className = "sync ok"; sync.textContent = s.ok; }
    else { sync.className = "sync"; sync.textContent = ""; }
  };
  refresh();

  note.addEventListener("input", () => { drafts[iss.key] = note.value; saveDrafts(); refresh(); });

  b.addEventListener("click", async () => {
    if(picker.dataset.open === "1"){
      picker.dataset.open = "0"; picker.innerHTML = ""; picker.style.display = "none";
      return;
    }
    b.disabled = true;
    picker.style.display = ""; picker.textContent = "Asking Jira…";
    try{
      const list = await transitionsFor(iss.key);
      picker.innerHTML = "";
      if(!list.length){
        picker.textContent = "No transitions available on this issue.";
      } else {
        const lbl = document.createElement("span");
        lbl.className = "sync"; lbl.textContent = "Move to:";
        picker.appendChild(lbl);
        for(const tr of list){
          const tb = document.createElement("button");
          tb.className = "move"; tb.textContent = tr.name;
          tb.addEventListener("click", async () => {
            Array.from(picker.querySelectorAll("button")).forEach(x => x.disabled = true);
            tb.textContent = "…";
            try{
              const landed = await applyTransition(iss.key, tr.id);
              f.status = landed || {name: tr.name,
                statusCategory: /^(done|closed|resolved|complete)/i.test(tr.name)
                  ? {key:"done"} : {key:"indeterminate"}};
              syncState[iss.key] = {ok: "Moved to " + f.status.name};
            }catch(e){
              syncState[iss.key] = {err: iss.key + ": " + errText(e)};
            }
            renderBoard();
          });
          picker.appendChild(tb);
        }
      }
      picker.dataset.open = "1";
    }catch(e){
      picker.textContent = "Couldn't load transitions: " + errText(e);
    }
    b.disabled = false;
  });

  push.addEventListener("click", async () => {
    const body = (note.value || "").trim();
    if(!body) return;
    push.disabled = true; sync.className = "sync"; sync.textContent = "Sending…";
    try{
      await call(CFG.JIRA, "addCommentToJiraIssue", {cloudId, issueIdOrKey: iss.key, commentBody: body});
      delete drafts[iss.key]; saveDrafts();
      syncState[iss.key] = {ok: "Comment posted"};
    }catch(e){
      syncState[iss.key] = {err: iss.key + ": " + errText(e)};
    }
    push.disabled = false;
    renderBoard();
  });

  return c;
}
function tally(){
  const live = issues.filter(i => !/^(nice to have|low|lowest|trivial)$/i.test(
    (i.fields.priority && i.fields.priority.name) || ""));
  const done = live.filter(isDone).length;
  const pct = live.length ? Math.round(done/live.length*100) : 0;
  $("pct").textContent = pct + "%";
  $("fill").style.width = pct + "%";
  $("tally").textContent = done + " done · " + (live.length - done) + " open · " +
    issues.length + " tracked";
}

function showDiagnostics(){
  const host = $("lanes");
  const sec = document.createElement("section");
  const h = document.createElement("h2");
  h.style.color = "var(--accent)"; h.style.cursor = "pointer";
  h.textContent = "Diagnostics";
  const em = document.createElement("em");
  em.textContent = "click to show what each call returned";
  h.appendChild(em);
  const pre = document.createElement("pre");
  pre.style.cssText = "display:none;background:var(--panel);border:1px solid var(--line);" +
    "border-radius:8px;padding:12px;overflow:auto;max-height:420px;font-size:11.5px;" +
    "white-space:pre-wrap;word-break:break-word";
  const dump = {};
  for(const k of Object.keys(RAW)){
    let s;
    try{ s = JSON.stringify(RAW[k], null, 1); }catch(e){ s = String(RAW[k]); }
    dump[k] = s && s.length > 4000 ? s.slice(0, 4000) + "\n…truncated" : s;
  }
  dump["_cloudId"] = cloudId || "(not resolved)";
  dump["_jql"] = CFG.JQL.replace("%LABEL%", CFG.LABEL);
  pre.textContent = Object.keys(dump).map(k => "── " + k + " ──\n" + dump[k]).join("\n\n");
  h.addEventListener("click", () => {
    pre.style.display = pre.style.display === "none" ? "" : "none";
    em.textContent = pre.style.display === "none"
      ? "click to show what each call returned" : "click to hide · copy this to Claude";
  });
  sec.appendChild(h); sec.appendChild(pre);
  host.appendChild(sec);
}

/* ---------- local note drafts ---------- */
async function saveDrafts(){
  if(!db) return;
  try{ await db.doc("ursula/drafts").set({drafts, updated: new Date().toISOString()}); }catch(e){}
}

/* ---------- boot ---------- */
(async () => {
  const [mon] = weekBounds();
  const fri = new Date(mon); fri.setDate(mon.getDate()+4);
  $("hdr").textContent = DAYNAME[1] + " " + mon.getDate() + " — " + DAYNAME[5] + " " + fri.getDate() +
    " " + mon.toLocaleString(undefined,{month:"short"});

  try{
    db = await claude.use("db");
    if(db){ const s = await db.doc("ursula/drafts").get(); if(s && s.data && s.data.drafts) drafts = s.data.drafts; }
  }catch(e){}

  mcp = await claude.use("mcp");
  if(!mcp){ setStatus("No connector access — this page can't reach Jira or Calendar from here.", true); return; }

  try{
    cloudId = await resolveCloudId();
    issues = await loadIssues();
    renderBoard();
    setStatus(issues.length + " issues labelled " + CFG.LABEL + " · status writes back to Jira");
  }catch(e){
    setStatus("Couldn't read Jira: " + errText(e), true);
    showDiagnostics();
  }

  try{
    renderWeek(await loadWeek());
  }catch(e){
    $("calnote").textContent = "calendar unavailable (" + errText(e) + ")";
    $("calpanel").style.display = "";
  }
})();
</script>
